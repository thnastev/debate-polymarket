# Netlify build settings.
#
# Only needed if you connect this repository to Netlify for automatic builds.
# If you are dragging a pre-built folder onto Netlify instead, the folder
# already contains _redirects and _headers and this file is not used.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Single-page app: every path must serve index.html, or refreshing on a market
# page returns a 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
